	<header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html"><span class="brand-mark">S</span><span>Study<span>Sphere</span></span></a><nav class="main-nav"><a href="../index.html">Trang chủ</a><a href="exams.html">Kho đề thi</a><a class="active" href="history.html">Lịch sử</a><a href="favorites.html">Đề đã lưu</a></nav></div></header>

		<section class="history-hero"><div class="container"><p class="eyebrow"><span class="eyebrow-dot"></span> Dấu mốc của bạn</p><h1>Lịch sử <em>làm bài.</em></h1><p>Theo dõi những lần luyện tập, nhìn lại điểm số và chọn nơi bạn muốn tiến bộ tiếp theo.</p></div></section>

			<div id="history-list" class="history-list"></div>
		</div></section>
	</main>
