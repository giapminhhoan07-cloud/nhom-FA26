<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tổng quan hoạt động và quản trị StudySphere.">
  <title>Tổng quan quản trị | StudySphere</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script type="module" src="../js/admin-dashboard.js"></script>
  <script defer src="../js/session.js"></script>
</head>
<body class="admin-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/?from=admin" aria-label="StudySphere - Trang chủ">
        <span class="brand-mark">S</span>
        <span>Study<span>Sphere</span></span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Mở menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="brand-block">
        <a class="brand" href="/?from=admin" aria-label="StudySphere - Trang chủ">
          <span class="brand-mark">S</span>
          <span>Study<span>Sphere</span></span>
        </a>
      </div>

      <nav class="admin-sidebar-nav" aria-label="Menu quản trị">
        <a class="admin-nav-item active" data-admin-section="overview" href="admin-dashboard.html"><span class="nav-icon">◫</span><span>Tổng quan</span></a>
        <a class="admin-nav-item" data-admin-section="exams" href="admin.html"><span class="nav-icon">▣</span><span>Quản lý đề thi</span></a>
        <a class="admin-nav-item" data-admin-section="users" href="admin-users.html"><span class="nav-icon">◍</span><span>Quản lý người dùng</span></a>
        <a class="admin-nav-item" data-admin-section="feedback" href="admin-feedback.html"><span class="nav-icon">◌</span><span>Phản hồi &amp; báo cáo</span></a>
      </nav>

      <div class="sidebar-summary">
        <span class="sidebar-kicker">Hệ thống</span>
        <strong>StudySphere</strong>
        <small>Website luyện thi THPT</small>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div>
          <p class="admin-page-kicker">Khu vực quản trị</p>
          <h1>Tổng quan</h1>
        </div>
        <div class="admin-header-actions">
          <span class="admin-header-pill">Theo dõi hoạt động thực tế</span>
        </div>
      </header>

      <section class="admin-content">
        <div class="admin-stat-grid" id="admin-stat-grid" aria-live="polite"></div>

        <section class="admin-chart-panel" aria-labelledby="chart-title">
          <div class="admin-panel-heading">
            <div>
              <span class="admin-kicker">Biểu đồ</span>
              <h2 id="chart-title">Hoạt động 7 ngày gần nhất</h2>
            </div>
          </div>
          <div class="admin-chart" id="admin-activity-chart" aria-live="polite"></div>
        </section>

        <div class="admin-grid-two">
          <section class="admin-data-panel" aria-labelledby="featured-title">
            <div class="admin-panel-heading">
              <div>
                <span class="admin-kicker">Đề thi</span>
                <h2 id="featured-title">Đề thi nổi bật</h2>
              </div>
            </div>
            <table class="admin-table" id="admin-featured-table"></table>
          </section>

          <section class="admin-data-panel" aria-labelledby="recent-feedback-title">
            <div class="admin-panel-heading">
              <div>
                <span class="admin-kicker">Phản hồi</span>
                <h2 id="recent-feedback-title">Phản hồi gần đây</h2>
              </div>
            </div>
            <table class="admin-table" id="admin-feedback-table"></table>
          </section>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
