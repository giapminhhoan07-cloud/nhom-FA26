<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quản trị đề thi StudySphere.">
  <title>Quản trị đề thi | StudySphere</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script defer src="../js/admin.js"></script>
  <script defer src="../js/session.js"></script>
</head>
<body class="admin-page">
  <header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html" aria-label="StudySphere - Trang chủ"><span class="brand-mark">S</span><span>Study<span>Sphere</span></span></a><nav class="main-nav" aria-label="Điều hướng chính"><a href="../index.html">Trang chủ</a><a class="active" href="admin.html">Quản trị</a><a href="exams.html">Kho đề thi</a></nav></div></header>
  <main>
    <section class="admin-hero"><div class="container"><p class="eyebrow"><span class="eyebrow-dot"></span> Khu vực quản trị</p><h1>Quản lý <em>đề thi.</em></h1><p>Upload đề mới, chỉnh sửa nội dung hoặc xóa những đề không còn phù hợp.</p></div></section>
    <section class="admin-section"><div class="container admin-layout">
      <div class="admin-list-panel"><div class="admin-panel-heading"><div><span class="admin-kicker">Thư viện nội bộ</span><h2>Danh sách đề thi</h2></div><button class="button button-primary" id="new-exam-button" type="button">+ Upload đề</button></div><p class="admin-message" id="list-message" aria-live="polite"></p><div class="admin-exam-list" id="admin-exam-list"></div></div>
      <section class="admin-form-panel" aria-labelledby="form-title"><div class="admin-panel-heading"><div><span class="admin-kicker">Biểu mẫu đề thi</span><h2 id="form-title">Upload đề mới</h2></div><button class="admin-reset" id="reset-form" type="button">Làm mới</button></div><p class="admin-message" id="form-message" aria-live="polite"></p><form id="exam-form" novalidate>
        <input id="exam-action" type="hidden" value="create">
        <label class="admin-upload-field">Chọn file đề (.pdf)<input id="exam-file" type="file" accept="application/pdf,.pdf" required><small>Chỉ nhận file PDF của đề thi.</small></label>
        <div class="admin-form-grid"><label class="admin-field">Mã đề<input id="exam-id" name="id" required pattern="[a-z0-9-]{3,100}" placeholder="toan-2026-de-01"><small>Chỉ dùng chữ thường, số và dấu gạch ngang.</small></label><label class="admin-field">Tên đề<input id="exam-title" name="title" required placeholder="Đề ôn tập Toán 2026"></label></div>
        <div class="admin-form-grid"><label class="admin-field">Môn học<select id="exam-subject" name="subject_id"><option value="toan">Toán</option><option value="ngu-van">Ngữ văn</option><option value="tieng-anh">Tiếng Anh</option><option value="vat-ly">Vật lý</option><option value="dia-li">Địa lí</option><option value="lich-su">Lịch sử</option></select></label><label class="admin-field">Năm<input id="exam-year" name="year" type="number" min="2000" max="2100" value="2026" required></label></div>
        <div class="admin-form-grid"><label class="admin-field">Loại đề<input id="exam-type" name="exam_type" required placeholder="on-tap"></label><label class="admin-field">Mức độ<select id="exam-difficulty" name="difficulty"><option value="easy">Cơ bản</option><option value="medium" selected>Trung bình</option><option value="hard">Khá khó</option></select></label></div>
        <div class="admin-form-grid"><label class="admin-field">Thời gian (phút)<input id="exam-duration" name="duration_minutes" type="number" min="1" value="60" required></label><label class="admin-field admin-check"><input id="exam-featured" name="featured" type="checkbox"><span>Hiển thị trong đề nổi bật</span></label></div>
        <label class="admin-field">Mô tả<textarea id="exam-description" name="description" rows="3" placeholder="Mô tả ngắn về đề thi"></textarea></label>
        <button class="button button-primary admin-submit" type="submit">Lưu đề thi <span aria-hidden="true">→</span></button>
      </form></section>
    </div></section>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><div><a class="brand footer-brand" href="../index.html"><span class="brand-mark">S</span><span>Study<span>Sphere</span></span></a><p>Khu vực quản trị nội dung học tập.</p></div></div></footer>
</body>
</html>
