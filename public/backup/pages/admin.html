<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quản lý đề thi StudySphere.">
  <title>Quản lý đề thi | StudySphere</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script type="module" src="../js/admin.js"></script>
  <script defer src="../js/session.js"></script>
</head>
<body class="admin-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html" aria-label="StudySphere - Trang chủ">
        <span class="brand-mark">S</span>
        <span>Study<span>Sphere</span></span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Mở menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="brand-block">
        <a class="brand" href="../index.html" aria-label="StudySphere - Trang chủ">
          <span class="brand-mark">S</span>
          <span>Study<span>Sphere</span></span>
        </a>
      </div>

      <nav class="admin-sidebar-nav" aria-label="Menu quản trị">
        <a class="admin-nav-item" data-admin-section="overview" href="admin-dashboard.html"><span class="nav-icon">◫</span><span>Tổng quan</span></a>
        <a class="admin-nav-item active" data-admin-section="exams" href="admin.html"><span class="nav-icon">▣</span><span>Quản lý đề thi</span></a>
        <a class="admin-nav-item" data-admin-section="users" href="admin-users.html"><span class="nav-icon">◍</span><span>Quản lý người dùng</span></a>
        <a class="admin-nav-item" data-admin-section="feedback" href="admin-feedback.html"><span class="nav-icon">◌</span><span>Phản hồi &amp; báo cáo</span></a>
      </nav>

      <div class="sidebar-summary">
        <span class="sidebar-kicker">Hệ thống</span>
        <strong>StudySphere</strong>
        <small>Website luyện thi THPT</small>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div>
          <p class="admin-page-kicker">Khu vực quản trị</p>
          <h1>Quản lý đề thi</h1>
        </div>
      </header>

      <section class="admin-content admin-layout-two">
        <section class="admin-list-panel">
          <div class="admin-panel-heading">
            <div><span class="admin-kicker">Thư viện nội bộ</span><h2>Danh sách đề thi</h2></div>
            <button class="button button-primary" id="new-exam-button" type="button">+ Tạo đề mới</button>
          </div>

          <div class="admin-toolbar">
            <label class="admin-search-field">
              <span>Tìm đề</span>
              <input id="exam-search" type="search" placeholder="Nhập tên đề hoặc môn học">
            </label>
            <label class="admin-filter-field">
              <span>Môn học</span>
              <select id="exam-subject-filter">
                <option value="all">Tất cả</option>
                <option value="toan">Toán</option>
                <option value="ngu-van">Ngữ văn</option>
                <option value="tieng-anh">Tiếng Anh</option>
                <option value="vat-ly">Vật lý</option>
                <option value="dia-li">Địa lí</option>
                <option value="lich-su">Lịch sử</option>
              </select>
            </label>
            <label class="admin-filter-field">
              <span>Trạng thái</span>
              <select id="exam-status-filter">
                <option value="all">Tất cả</option>
                <option value="featured">Đề nổi bật</option>
                <option value="normal">Bình thường</option>
              </select>
            </label>
          </div>

          <p class="admin-message" id="list-message" aria-live="polite"></p>
          <div class="admin-exam-list" id="admin-exam-list"></div>
        </section>

        <section class="admin-form-panel" aria-labelledby="form-title">
          <div class="admin-panel-heading">
            <div><span class="admin-kicker">Biểu mẫu</span><h2 id="form-title">Tạo đề thi mới</h2></div>
            <button class="admin-reset" id="reset-form" type="button">Làm mới</button>
          </div>
          <p class="admin-message" id="form-message" aria-live="polite"></p>
          <form id="exam-form" novalidate>
            <input id="exam-action" type="hidden" value="create">
            <label class="admin-upload-field">Chọn file đề (.pdf)<input id="exam-file" type="file" accept="application/pdf,.pdf" required><small>Chỉ nhận file PDF của đề thi.</small></label>
            <div class="admin-form-grid">
              <label class="admin-field">Mã đề<input id="exam-id" name="id" required pattern="[a-z0-9\-]{3,100}" placeholder="toan-2026-de-01"><small>Chỉ dùng chữ thường, số và dấu gạch ngang.</small></label>
              <label class="admin-field">Tên đề<input id="exam-title" name="title" required placeholder="Đề ôn tập Toán 2026"></label>
            </div>
            <div class="admin-form-grid">
              <label class="admin-field">Môn học<select id="exam-subject" name="subject_id"><option value="toan">Toán</option><option value="ngu-van">Ngữ văn</option><option value="tieng-anh">Tiếng Anh</option><option value="vat-ly">Vật lý</option><option value="dia-li">Địa lí</option><option value="lich-su">Lịch sử</option></select></label>
              <label class="admin-field">Năm<input id="exam-year" name="year" type="number" min="2000" max="2100" value="2026" required></label>
            </div>
            <div class="admin-form-grid">
              <label class="admin-field">Loại đề<select id="exam-type" name="exam_type"><option value="minh-hoa">Đề minh họa</option><option value="khao-sat">Đề khảo sát</option><option value="thi-thu">Đề thi thử</option><option value="on-tap">Đề ôn tập</option><option value="thpt">Tốt nghiệp THPT</option></select></label>
              <label class="admin-field">Mức độ<select id="exam-difficulty" name="difficulty"><option value="easy">Cơ bản</option><option value="medium" selected>Trung bình</option><option value="hard">Khá khó</option></select></label>
            </div>
            <div class="admin-form-grid">
              <label class="admin-field">Thời gian (phút)<input id="exam-duration" name="duration_minutes" type="number" min="1" value="60" required></label>
              <label class="admin-field admin-check"><input id="exam-featured" name="featured" type="checkbox"><span>Hiển thị trong đề nổi bật</span></label>
            </div>
            <label class="admin-field">Mô tả<textarea id="exam-description" name="description" rows="3" placeholder="Mô tả ngắn về đề thi"></textarea></label>
            <button class="button button-primary admin-submit" type="submit">Lưu đề thi <span aria-hidden="true">→</span></button>
          </form>

          <section class="admin-export-panel" id="export-panel" aria-labelledby="export-title" hidden>
            <div class="admin-panel-heading">
              <div><span class="admin-kicker">Xuất tệp</span><h2 id="export-title">Tệp dữ liệu đề</h2></div>
            </div>
            <p class="admin-export-note" id="export-note"></p>
            <label class="admin-field" for="export-source">Dữ liệu dự phòng để cập nhật public/backup/data/exams.js</label>
            <textarea id="export-source" rows="12" readonly></textarea>
            <div class="admin-export-actions">
              <button class="button button-primary" id="save-to-folder" type="button">Lưu vào thư mục chung</button>
              <button class="button button-quiet" id="copy-export" type="button">Sao chép mã</button>
              <button class="button button-quiet" id="download-export" type="button">Tải exams.js</button>
            </div>
          </section>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
