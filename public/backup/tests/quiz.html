<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Làm bài kiểm tra | StudySphere</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/quiz.css">
  <script>const params = new URLSearchParams(location.search); if (!params.has("test") && params.get("scope") !== "1") location.replace("./");</script>
  <script defer src="../js/session.js"></script>
  <script type="module" src="../js/quiz.js"></script>
</head>
<body class="quiz-body">
  <header class="quiz-header">
    <div class="container quiz-header-inner">
      <a class="brand" href="index.html"><span class="brand-mark">S</span><span>Study<span>Sphere</span></span></a>
      <div class="quiz-title" id="quiz-title">Đang tải bài kiểm tra...</div>
      <a class="quiz-select-link" href="./">Chọn bài khác</a>
      <div class="timer" id="timer" aria-live="polite">30:00</div>
    </div>
  </header>
  <main class="quiz-main">
    <div class="container quiz-layout">
      <section>
        <div class="quiz-progress"><span id="progress-label">Câu 1 / 20</span><div><span id="progress-value"></span></div></div>
        <div id="question-card" class="question-card"></div>
        <div class="quiz-actions"><button class="button button-quiet" id="previous-button" type="button">← Câu trước</button><button class="button button-primary" id="next-button" type="button">Câu tiếp theo →</button></div>
      </section>
      <aside class="question-nav"><strong>Danh sách câu</strong><div id="question-dots"></div><button class="submit-button" id="submit-button" type="button">Nộp bài</button></aside>
    </div>
  </main>
</body>
</html>
